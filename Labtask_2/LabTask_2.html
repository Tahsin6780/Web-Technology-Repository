<!DOCTYPE html>
<html>
  <head>
    <title>Food Menu</title>
    <link rel="stylesheet" type="text/css" href="style.css" />
  </head>

  <body>
    <h1>Our Delicious Menu</h1>
    
    <div class="parent-div">
      
      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=400&q=80"
          alt="Cheeseburger"
        />
        <h2>Classic Beef</h2>
        <h2>Cheeseburger</h2>
        <h3>$12.99</h3>
        <button>Order Now</button>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1513104890138-7c749659a591?auto=format&fit=crop&w=400&q=80"
          alt="Margherita Pizza"
        />
        <h2>Wood-Fired</h2>
        <h2>Margherita Pizza</h2>
        <h3>$15.00</h3>
        <button>Order Now</button>
      </div>

      <div class="card">
        <img
          src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601?auto=format&fit=crop&w=400&q=80"
          alt="Alfredo Pasta"
        />
        <h2>Creamy Truffle</h2>
        <h2>Alfredo Pasta</h2>
        <h3>$14.50</h3>
        <button>Order Now</button>
      </div>

    </div>
  </body>
</html>
